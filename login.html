<html>

<head>
    <title>E-commerce Website</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div>
    <form action="#" method="post" id="loginForm">
        <label for="username"><i class="fas fa-user"></i> Username</label>
        <input type="text" id="username" name="Username" placeholder="Enter your name" required><br><br>
        <label for="password"><i class="fas fa-lock"></i> Password</label>
        <input type="password" id="password" name="Password" placeholder="Enter your password" required><br><br>
        <button type="submit"><i class="fas fa-sign-in-alt"></i> Login</button>
        <div class="message" id="message" ></div>
    </form>
    </div>
    <script>
        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");

        loginForm.addEventListener("submit", function (event) {
            event.preventDefault(); // Prevent the form from submitting normally
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            const correctUsername = "admin"; // Example username
            const correctPassword = "password123"; // Example password

            // Here you can add your login logic, e.g., sending data to a server
            if (username === correctUsername && password === correctPassword) {
                message.innerHTML = "Login successful!";
                message.style.color = "green";
            } else {
                message.innerHTML = "Invalid Username or Password.";
                message.style.color = "red";
            }
        }
    );        
    </script>
</body>

</html>
